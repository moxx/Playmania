<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#1b1035" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Playmania" />
    <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
    <link rel="icon" type="image/png" href="icons/icon-192.png" />
    <link rel="manifest" href="manifest.webmanifest" />
    <title>Playmania</title>
    <style>
      :root {
        --sat: env(safe-area-inset-top, 0px);
        --sar: env(safe-area-inset-right, 0px);
        --sab: env(safe-area-inset-bottom, 0px);
        --sal: env(safe-area-inset-left, 0px);
      }
      html, body {
        margin: 0; padding: 0; width: 100%; height: 100%;
        overflow: hidden; background: #1b1035;
        overscroll-behavior: none; touch-action: none;
        -webkit-user-select: none; user-select: none;
        -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent;
      }
      #three { position: fixed; inset: 0; width: 100%; height: 100%; z-index: 0; pointer-events: none; }
      #game { position: fixed; inset: 0; z-index: 1; }
      #game canvas { display: block; touch-action: none; }
      #rotate {
        display: none; position: fixed; inset: 0; z-index: 10;
        background: #1b1035; color: #fff; font: 600 22px Fredoka, system-ui, sans-serif;
        align-items: center; justify-content: center; flex-direction: column; gap: 16px; text-align: center;
      }
      #rotate .phone { font-size: 64px; animation: turn 1.6s ease-in-out infinite; }
      @keyframes turn { 0%, 30% { transform: rotate(0); } 60%, 100% { transform: rotate(-90deg); } }
      @media (orientation: portrait) and (max-width: 900px) { #rotate { display: flex; } }
    </style>
  </head>
  <body>
    <div id="game"></div>
    <div id="rotate"><div class="phone">📱</div><div>Bitte dreh dein Gerät quer</div></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
